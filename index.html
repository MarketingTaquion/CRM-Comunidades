<title>CRM de Comunidades</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&display=swap">
<style>
:root{
  --tq-negro:#000000; --tq-blanco:#FFFFFF;
  --tq-gris-050:#F5F5F6; --tq-gris-200:#D4D4D7; --tq-gris-400:#999999; --tq-gris-600:#666666; --tq-gris-800:#3D3D3D; --tq-gris-900:#2D2D2D;
  --tq-fucsia:#FF00B8; --tq-naranja:#FFA900; --tq-azul:#5B7CFF;
  --tq-line-inverse:rgba(255,255,255,.24);

  --bg:#000000; --panel:#141414; --panel-raised:#1D1D1D; --panel-sunken:#0A0A0A;
  --border:rgba(255,255,255,.10); --border-strong:var(--tq-line-inverse);
  --text-strong:var(--tq-blanco); --text-body:var(--tq-gris-200); --text-muted:var(--tq-gris-400); --text-faint:var(--tq-gris-600);

  --font:"Archivo","Archivo Fallback",system-ui,sans-serif;
  --r-in:4px; --r-card:8px; --r-full:999px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg); color:var(--text-body); font-family:var(--font); -webkit-font-smoothing:antialiased; font-variant-numeric:tabular-nums}
h1,h2,h3,h4{color:var(--text-strong); margin:0; font-weight:900; letter-spacing:-.01em}
p{margin:0}
button,select{font-family:inherit}
::selection{background:var(--tq-fucsia); color:#fff}

.app{display:grid; grid-template-columns:252px 1fr; min-height:100vh}

/* ---------- sidebar ---------- */
.sidebar{background:var(--panel-sunken); border-right:1px solid var(--border); padding:20px 16px; display:flex; flex-direction:column}
.brand{display:flex; align-items:center; gap:9px; margin-bottom:2px}
.brand svg{width:20px; height:20px; flex:none}
.brand b{font-size:15px; color:#fff}
.brand-sub{font-size:10.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.08em; margin-left:29px; margin-bottom:22px}

.eyebrow{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--text-faint); margin-bottom:8px}
.field{width:100%; background:var(--panel-raised); border:1px solid var(--border-strong); color:#fff; font-size:13px; font-weight:600; padding:9px 10px; border-radius:var(--r-in); appearance:none; margin-bottom:20px}

.navlist{display:flex; flex-direction:column; gap:1px; margin-bottom:22px}
.nav-item{display:flex; align-items:center; gap:9px; padding:9px 10px; border-radius:var(--r-in); font-size:13px; color:var(--text-body); cursor:pointer; border:1px solid transparent; background:none; text-align:left; width:100%}
.nav-item:hover{background:var(--panel-raised)}
.nav-item.active{background:var(--panel-raised); border-color:var(--border-strong); color:#fff; font-weight:700}
.nav-item.locked{color:var(--text-faint); cursor:default}
.nav-item.locked:hover{background:none}
.nav-dot{width:6px; height:6px; border-radius:50%; background:var(--text-faint); flex:none}
.nav-item.active .nav-dot{background:var(--tq-fucsia)}
.nav-item .icn{width:12px; height:12px; flex:none; color:var(--text-faint)}

.sys-item{display:flex; align-items:center; gap:9px; padding:9px 10px; border-radius:var(--r-in); font-size:13px; color:var(--text-body); cursor:pointer; border:1px solid transparent; background:none; text-align:left; width:100%}
.sys-item:hover{background:var(--panel-raised)}
.sys-item.active{background:var(--panel-raised); border-color:var(--border-strong); color:#fff; font-weight:700}

.sidebar-foot{margin-top:auto; padding-top:16px; border-top:1px solid var(--border)}
.role-caption{font-size:11px; color:var(--text-faint); line-height:1.5; margin-top:8px}
.role-caption b{color:var(--text-muted)}

/* ---------- main ---------- */
.main{padding:26px 32px 60px; max-width:1220px}
.main-head{display:flex; justify-content:space-between; align-items:flex-start; gap:16px; margin-bottom:22px; flex-wrap:wrap}
.main-head h2{font-size:21px}
.main-head .sub{font-size:13px; color:var(--text-muted); margin-top:4px}
.role-badge{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--text-faint); border:1px solid var(--border-strong); padding:5px 11px; border-radius:var(--r-full); white-space:nowrap}
.role-badge.am{color:var(--tq-azul); border-color:var(--tq-azul)}
.role-badge.cliente{color:var(--tq-naranja); border-color:var(--tq-naranja)}
.role-badge.admin{color:var(--tq-fucsia); border-color:var(--tq-fucsia)}

.kpi-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px; margin-bottom:22px}
.kpi{background:var(--panel); border:1px solid var(--border); border-radius:var(--r-card); padding:16px 18px}
.kpi .v{font-size:26px; font-weight:900; color:#fff; line-height:1.1}
.kpi .l{font-size:11.5px; color:var(--text-muted); margin-top:7px; text-transform:uppercase; letter-spacing:.03em}
.kpi .t{font-size:11px; color:var(--text-faint); margin-top:3px}

.card{background:var(--panel); border:1px solid var(--border); border-radius:var(--r-card); padding:20px; margin-bottom:16px}
.card h3{font-size:14px; margin-bottom:2px}
.card .sub{font-size:12px; color:var(--text-muted); margin-bottom:16px}

.bar-row{display:grid; grid-template-columns:200px 1fr 44px; align-items:center; gap:12px; margin-bottom:12px; font-size:12.5px}
.bar-row:last-child{margin-bottom:0}
.bar-track{height:8px; background:var(--panel-raised); border-radius:99px; overflow:hidden}
.bar-fill{height:100%; background:linear-gradient(90deg,#FF00A8,#FF9F00)}
.bar-val{text-align:right; color:var(--text-muted)}

table{border-collapse:collapse; width:100%}
th{text-align:left; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--text-faint); padding:0 12px 9px; border-bottom:1px solid var(--border)}
td{padding:11px 12px; font-size:12.5px; color:var(--text-body); border-bottom:1px solid var(--border); vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--panel-raised)}
.tbl-wrap{overflow-x:auto}
.mono{font-variant-numeric:tabular-nums; color:var(--text-muted)}

.pill{display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:var(--r-full); font-size:10.5px; font-weight:700; letter-spacing:.02em; white-space:nowrap; border:1px solid transparent}
.state-anonimo{color:var(--text-faint); border-color:var(--border-strong); background:rgba(255,255,255,.02)}
.state-pseudo{color:var(--text-muted); border-color:var(--border-strong); background:rgba(255,255,255,.03)}
.state-semi{color:var(--tq-azul); border-color:rgba(91,124,255,.4); background:rgba(91,124,255,.08)}
.state-identificado{color:var(--tq-azul); border-color:rgba(91,124,255,.55); background:rgba(91,124,255,.14); font-weight:800}
.state-enriquecido{color:var(--tq-naranja); border-color:rgba(255,169,0,.45); background:rgba(255,169,0,.1)}
.state-confirmado{color:var(--tq-fucsia); border-color:rgba(255,0,184,.45); background:rgba(255,0,184,.1)}

.funnel{display:grid; grid-template-columns:repeat(6,1fr); gap:10px; margin-bottom:22px}
.funnel-step{background:var(--panel); border:1px solid var(--border); border-radius:var(--r-card); padding:14px 14px; position:relative}
.funnel-step .v{font-size:19px; font-weight:900; color:#fff}
.funnel-step .l{font-size:10.5px; color:var(--text-muted); margin-top:5px}
.funnel-step .drop{font-size:10px; color:var(--tq-naranja); margin-top:8px; padding-top:8px; border-top:1px solid var(--border)}
.funnel-arrow{position:absolute; right:-14px; top:50%; transform:translateY(-50%); color:var(--text-faint); font-size:14px}
.funnel-step:last-child .funnel-arrow{display:none}

.btn{display:inline-flex; align-items:center; gap:6px; border-radius:var(--r-in); border:1px solid var(--border-strong); background:transparent; color:var(--text-strong); padding:9px 14px; font-size:12.5px; font-weight:700; cursor:pointer; white-space:nowrap}
.btn:hover{background:var(--panel-raised)}
.btn[disabled]{opacity:.35; cursor:not-allowed}
.btn[disabled]:hover{background:none}
.btn-fill{background:var(--tq-fucsia); border-color:var(--tq-fucsia); color:#000}
.btn-fill:hover{background:#ff33c6}

.export-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:20px}
.export-card{background:var(--panel); border:1px solid var(--border); border-radius:var(--r-card); padding:18px}
.export-card .head{display:flex; align-items:center; gap:8px; margin-bottom:10px}
.export-dot{width:8px; height:8px; border-radius:50%; flex:none}
.export-card p{font-size:12px; color:var(--text-muted); line-height:1.5; margin-bottom:14px; min-height:52px}

.locked-panel{border:1px dashed var(--border-strong); border-radius:var(--r-card); padding:44px 24px; text-align:center; color:var(--text-faint)}
.locked-panel svg{width:22px; height:22px; margin-bottom:10px; color:var(--text-faint)}
.locked-panel b{color:var(--text-muted); display:block; margin-bottom:5px; font-size:13px}
.locked-panel span{font-size:12px}

.icn-inline{width:12px; height:12px; flex:none}
.filters{display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap}
.filters select{background:var(--panel-raised); border:1px solid var(--border-strong); color:var(--text-body); font-size:12px; padding:7px 10px; border-radius:var(--r-in)}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="ico-lock" viewBox="0 0 16 16"><rect x="3.25" y="7.25" width="9.5" height="6.75" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M5.5 7.25V5.4a2.5 2.5 0 0 1 5 0v1.85" fill="none" stroke="currentColor" stroke-width="1.4"/></symbol>
  <symbol id="ico-eye" viewBox="0 0 16 16"><path d="M1 8s2.6-4.5 7-4.5S15 8 15 8s-2.6 4.5-7 4.5S1 8 1 8z" fill="none" stroke="currentColor" stroke-width="1.3"/><circle cx="8" cy="8" r="2" fill="none" stroke="currentColor" stroke-width="1.3"/></symbol>
  <symbol id="ico-comunidad" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8.5" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="10" cy="10" r="2.6" fill="currentColor"/><path d="M10 1.5v3M10 15.5v3M1.5 10h3M15.5 10h3" stroke="currentColor" stroke-width="1.4"/></symbol>
</svg>

<div class="app">
  <aside class="sidebar">
    <div class="brand"><svg viewBox="0 0 20 20" style="color:var(--tq-fucsia)"><use href="#ico-comunidad"/></svg><b>Comunidades</b></div>
    <div class="brand-sub">CRM interno · Taquion</div>

    <div class="eyebrow">Comunidad activa</div>
    <select class="field" id="selComunidad"></select>

    <div class="eyebrow">Tablero — 6 activos</div>
    <div class="navlist" id="navActivos"></div>

    <div class="eyebrow">Sistema</div>
    <div class="navlist">
      <button class="sys-item" id="navExport">Exportación de datos</button>
    </div>

    <div class="sidebar-foot">
      <div class="eyebrow" style="margin-bottom:6px">Ver como rol</div>
      <select class="field" id="selRole" style="margin-bottom:0">
        <option value="admin_taquion">admin_taquion</option>
        <option value="am_estratega">AM-Estratega</option>
        <option value="cliente">cliente</option>
      </select>
      <div class="role-caption" id="roleCaption"></div>
    </div>
  </aside>

  <main class="main">
    <div class="main-head">
      <div>
        <h2 id="hTitle">—</h2>
        <div class="sub" id="hSub">—</div>
      </div>
      <span class="role-badge" id="roleBadge">admin_taquion</span>
    </div>
    <div id="content"></div>
  </main>
</div>

<script>

};

const ACTIVOS = ['conocimiento','voz','crecimiento','relacion','activaciones','decisiones'];
const ACTIVO_LABEL = {conocimiento:'Conocimiento',voz:'Voz',crecimiento:'Crecimiento',relacion:'Relación',activaciones:'Activaciones',decisiones:'Decisiones'};
const ACTIVO_SUB = {
  conocimiento:'Escucha, análisis e interpretación de la comunidad',
  voz:'Creación y distribución sistemática de contenido',
  crecimiento:'Adquisición, retención y funnel de identificación',
  relacion:'Punto donde la audiencia anonimizada pasa a ser nominada',
  activaciones:'El negocio entra a la comunidad',
  decisiones:'La comunidad, convertida en decisiones',
};
const STATE_LABEL = {anonimo:'anónimo',pseudo:'pseudo-anónimo',semi:'semi identificado',identificado:'identificado',enriquecido:'enriquecido',confirmado:'confirmado'};

let state = { comunidad:'umc', activo:'conocimiento', role:'cliente' };

/* ---------- helpers de render ---------- */
function esc(s){ return s===null||s===undefined ? '' : s; }

function kpiGrid(items){
  return '<div class="kpi-grid">' + items.map(([v,l,t])=>
    `<div class="kpi"><div class="v">${v}</div><div class="l">${l}</div><div class="t">${t}</div></div>`
  ).join('') + '</div>';
}

function lockedPanel(msg){
  return `<div class="locked-panel"><svg><use href="#ico-lock"/></svg><b>Activo deshabilitado</b><span>${msg}</span></div>`;
}

function renderConocimiento(d){
  let html = kpiGrid(d.kpis);
  if(d.arquetipos){
    html += `<div class="card"><h3>Distribución de arquetipos</h3><div class="sub">Solo contactos identificados o más — no incluye anónimos/pseudo-anónimos.</div>` +
      d.arquetipos.map(([n,p])=>`<div class="bar-row"><span>${n}</span><div class="bar-track"><div class="bar-fill" style="width:${p*2.4}%"></div></div><span class="bar-val">${p}%</span></div>`).join('') +
      `</div>`;
  } else {
    html += `<div class="card"><h3>Distribución de arquetipos</h3><div class="sub" style="margin-bottom:0">Aún no se corrió el modelo de arquetipación para esta comunidad — distinto de "sin datos": todavía no se intentó.</div></div>`;
  }
  if(d.brecha){
    html += `<div class="card"><h3>Brecha semántica — ejes temáticos más mencionados</h3><div class="sub">Salida del análisis de conversación de WhatsApp + comentarios de RRSS (Claude API).</div>
      <div class="tbl-wrap"><table><thead><tr><th>Eje</th><th>Menciones</th><th>Sentiment</th><th>Corredor con mayor peso</th></tr></thead><tbody>` +
      d.brecha.map(([eje,m,s,c])=>`<tr><td>${eje}</td><td class="mono">${m}</td><td>${s}</td><td>${c}</td></tr>`).join('') +
      `</tbody></table></div></div>`;
  } else {
    html += `<div class="card"><h3>Brecha semántica</h3><div class="sub" style="margin-bottom:0">Sin volumen de conversación suficiente todavía para calcular ejes temáticos.</div></div>`;
  }
  return html;
}

function renderVoz(d){
  return kpiGrid(d.kpis) +
    `<div class="card"><h3>Rendimiento por canal</h3><div class="sub">Cada fila declara su propia fuente técnica — nunca un promedio disfrazado de dato único.</div>
    <div class="tbl-wrap"><table><thead><tr><th>Canal</th><th>Piezas</th><th>Reach</th><th>Engagement</th><th>Fuente técnica</th></tr></thead><tbody>` +
    d.canales.map(([c,p,r,e,f])=>`<tr><td>${c}</td><td class="mono">${p}</td><td class="mono">${r}</td><td>${e}</td><td style="color:var(--text-muted)">${f}</td></tr>`).join('') +
    `</tbody></table></div></div>`;
}

function renderCrecimiento(d){
  const funnel = `<div class="funnel">` + d.funnel.map(([n,v,sub,drop],i)=>
    `<div class="funnel-step"><div class="v">${v.toLocaleString('es-AR')}</div><div class="l">${n}<br>${sub}</div>${drop?`<div class="drop">${drop==='—'?'sin caída medible':'−'+drop+' vs. paso anterior'}</div>`:''}${i<d.funnel.length-1?'<span class="funnel-arrow">→</span>':''}</div>`
  ).join('') + `</div>`;
  return `<div class="card"><h3>Funnel de identificación</h3><div class="sub">Un solo contacto avanzando por su <code>estado_identificacion</code> — no dos bases separadas.</div>${funnel}</div>` + kpiGrid(d.kpis);
}

function stateClass(k){ return {anonimo:'state-anonimo',pseudo:'state-pseudo',semi:'state-semi',identificado:'state-identificado',enriquecido:'state-enriquecido',confirmado:'state-confirmado'}[k]; }

function contactName(row, role){
  const [estado,,,,,nombre] = row;
  if(role==='cliente') return estado==='anonimo'||estado==='pseudo' ? 'anónimo' : 'contacto (oculto)';
  if(!nombre) return estado==='anonimo'||estado==='pseudo' ? 'anónimo' : 'contacto identificado';
  // admin_taquion y am_estratega ven nombre solo si el contacto ya está enriquecido/confirmado
  if(estado==='enriquecido' || estado==='confirmado') return nombre;
  return 'contacto identificado';
}

function renderRelacion(d, role){
  const rows = d.contactos.map(row=>{
    const [estado,corredor,arq,nivel,ultima] = row;
    return `<tr><td>${contactName(row,role)}</td><td><span class="pill ${stateClass(estado)}">${STATE_LABEL[estado]}</span></td><td>${corredor}</td><td>${arq}</td><td class="mono">${nivel}</td><td style="color:var(--text-faint)">${ultima}</td></tr>`;
  }).join('');
  const tabla = `<div class="card"><h3>Contactos</h3><div class="sub">Qué columna de identidad se ve depende del rol activo — así se aplica la gobernanza de visibilidad.</div>
    <div class="filters"><select disabled><option>${d.filtros[0]}</option></select><select disabled><option>${d.filtros[1]}</option></select><select disabled><option>${d.filtros[2]}</option></select></div>
    <div class="tbl-wrap"><table><thead><tr><th>Contacto</th><th>Estado</th><th>Corredor / localidad</th><th>Arquetipo / interés</th><th>Nivel activación</th><th>Última interacción</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;

  let mapa;
  if(role==='cliente'){
    mapa = `<div class="card"><h3>Mapa de Voces (Top Activadores)</h3><div class="sub" style="margin-bottom:0">Uso interno de Taquión — nunca visible para el rol cliente.</div>${lockedPanel('No disponible para el rol cliente.')}</div>`;
  } else {
    mapa = `<div class="card"><h3>Mapa de Voces (Top Activadores)</h3><div class="sub">Vista filtrada sobre la misma tabla de contactos — estado Enriquecido/Confirmado + nivel de activación alto. No es una tabla aparte.</div>
      <div class="tbl-wrap"><table><thead><tr><th>Nombre</th><th>Corredor</th><th>Arquetipo</th><th>Nivel</th><th>Afinidad narrativa</th></tr></thead><tbody>` +
      d.mapaVoces.map(([n,c,a,nv,af])=>`<tr><td style="color:#fff">${n}</td><td>${c}</td><td>${a}</td><td class="mono">${nv}</td><td class="mono">${af}</td></tr>`).join('') +
      `</tbody></table></div></div>`;
  }
  return tabla + mapa;
}

function renderExport(role){
  const canNivel2 = role!=='cliente';
  const canNivel3 = role==='admin_taquion';
  return `<div class="export-grid">
    <div class="export-card"><div class="head"><span class="export-dot" style="background:var(--tq-azul)"></span><b style="color:#fff;font-size:13px">Nivel 1 · Operativo/cliente</b></div>
      <p>Agregado por arquetipo, corredor y nivel de activación. Nunca nombre, teléfono ni username individual — sin importar el estado de identificación del contacto agregado.</p>
      <button class="btn btn-fill">Exportar CSV</button> <button class="btn">Exportar XLSX</button></div>
    <div class="export-card"><div class="head"><span class="export-dot" style="background:var(--tq-naranja)"></span><b style="color:#fff;font-size:13px">Nivel 2 · Interno Taquión</b></div>
      <p>Dataset nominal completo, incluye el Mapa de Voces. Requiere rol admin_taquion o AM-Estratega y un motivo registrado antes de generarse.</p>
      <button class="btn" ${canNivel2?'':'disabled'}><svg class="icn-inline"><use href="#ico-lock"/></svg>Exportar dataset nominal</button></div>
    <div class="export-card"><div class="head"><span class="export-dot" style="background:var(--tq-fucsia)"></span><b style="color:#fff;font-size:13px">Nivel 3 · Plataformas externas</b></div>
      <p>No es un archivo: push directo. Custom Audience a Meta Ads (teléfono siempre hasheado) o sync a Google Sheets / Airtable.</p>
      <button class="btn" ${canNivel3?'':'disabled'}><svg class="icn-inline"><use href="#ico-lock"/></svg>Push Custom Audience</button></div>
  </div>
  <div class="card"><h3>Audit log</h3><div class="sub">Toda exportación de Nivel 2 queda acá — quién, cuándo, motivo y filtro usado. Sin excepción, ni siquiera para admin_taquion.</div>
  <div class="tbl-wrap"><table><thead><tr><th>Fecha</th><th>Usuario</th><th>Nivel</th><th>Comunidad</th><th>Motivo</th></tr></thead><tbody>
  <tr><td class="mono">17/09 · 14:02</td><td>admin_taquion</td><td><span class="pill state-enriquecido">Nivel 2</span></td><td>Un Metro Cuadrado</td><td>Cruce con encuesta de imagen — pedido de Insights</td></tr>
  </tbody></table></div></div>`;
}

/* ---------- render principal ---------- */
function populateSidebar(){
  const selC = document.getElementById('selComunidad');
  selC.innerHTML = Object.entries(COMUNIDADES).map(([id,c])=>`<option value="${id}">${c.nombre} (${c.cliente})</option>`).join('');
  selC.value = state.comunidad;
  selC.onchange = e=>{ state.comunidad = e.target.value; if(!COMUNIDADES[state.comunidad].enabled[state.activo]) state.activo='conocimiento'; renderAll(); };

  document.getElementById('selRole').onchange = e=>{ state.role = e.target.value; renderAll(); };
}

function renderNav(){
  const c = COMUNIDADES[state.comunidad];
  const nav = document.getElementById('navActivos');
  nav.innerHTML = ACTIVOS.map((a,i)=>{
    const on = c.enabled[a];
    const active = state.activo===a && on;
    return `<button class="nav-item ${active?'active':''} ${on?'':'locked'}" data-a="${a}" ${on?'':'disabled'}>
      ${on?`<span class="nav-dot"></span>`:`<svg class="icn"><use href="#ico-lock"/></svg>`}
      ${i+1}. ${ACTIVO_LABEL[a]}
    </button>`;
  }).join('');
  nav.querySelectorAll('.nav-item').forEach(btn=>{
    if(btn.disabled) return;
    btn.onclick = ()=>{ state.activo = btn.dataset.a; renderAll(); };
  });
  document.getElementById('navExport').onclick = ()=>{ state.activo = '__export'; renderAll(); };
}

function renderRoleCaption(){
  const badge = document.getElementById('roleBadge');
  const cap = document.getElementById('roleCaption');
  badge.textContent = state.role;
  badge.className = 'role-badge ' + ({admin_taquion:'admin',am_estratega:'am',cliente:'cliente'}[state.role]);
  const texts = {
    admin_taquion:'Ve todas las comunidades, el Mapa de Voces y los 3 niveles de exportación. Único rol implementado hoy (MVP) — los otros dos son una vista previa sin login real.',
    am_estratega:'Backlog. Vería solo sus comunidades asignadas, el Mapa de Voces y exportación de nivel 1/2 — nunca nivel 3.',
    cliente:'Backlog. Ve solo activos habilitados para su etapa, siempre agregado o pseudonimizado. Nunca ve el Mapa de Voces ni exportación nominal.',
  };
  cap.innerHTML = texts[state.role];
}

function renderAll(){
  populateSidebar(); // keep selects in sync without losing focus issues (cheap for this mockup)
  document.getElementById('selComunidad').value = state.comunidad;
  document.getElementById('selRole').value = state.role;
  renderNav();
  renderRoleCaption();

  const c = COMUNIDADES[state.comunidad];
  const content = document.getElementById('content');
  const title = document.getElementById('hTitle');
  const sub = document.getElementById('hSub');

  if(state.activo === '__export'){
    title.textContent = 'Exportación de datos';
    sub.textContent = `${c.nombre} (${c.cliente}) · los 3 niveles de export y su gobernanza`;
    content.innerHTML = renderExport(state.role);
    return;
  }

  title.textContent = ACTIVO_LABEL[state.activo];
  sub.textContent = `${c.nombre} (${c.cliente}) · ${ACTIVO_SUB[state.activo]}`;

  if(!c.enabled[state.activo]){
    const why = state.activo==='activaciones' ? 'Se habilita ante una campaña puntual de negocio.'
      : state.activo==='decisiones' ? 'Se escribe manualmente al cierre de la Temporada.'
      : `Se habilita cuando la comunidad llega a la etapa correspondiente — hoy está en "${c.etapaLabel}".`;
    content.innerHTML = lockedPanel(why);
    return;
  }

  const d = CONTENT[state.comunidad][state.activo];
  if(state.activo==='conocimiento') content.innerHTML = renderConocimiento(d);
  else if(state.activo==='voz') content.innerHTML = renderVoz(d);
  else if(state.activo==='crecimiento') content.innerHTML = renderCrecimiento(d);
  else if(state.activo==='relacion') content.innerHTML = renderRelacion(d, state.role);
}

renderAll();
</script>
